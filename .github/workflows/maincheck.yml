name: maincheck

on:
    push:
        branches:
        - main
        - master
        - '*CI*'
    pull_request:
        branches:
        - '*'

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ['3.12', '3.13', '3.14']
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
              python-version: ${{ matrix.python-version }}
        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
              enable-cache: true
              cache-dependency-glob: |
                  pyproject.toml
                  uv.lock
        - name: Install dependencies
          run: uv sync
        - name: Run tests (pytest + doctests)
          run: uv run pytest music21_mnx

    ruff:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.14'
            - name: Install uv
              uses: astral-sh/setup-uv@v7
            - name: Install dependencies
              run: uv sync
            - name: Code-style with Ruff
              run: uv run ruff check music21_mnx

    mypy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.14'
            - name: Install uv
              uses: astral-sh/setup-uv@v7
            - name: Install dependencies
              run: uv sync
            - name: Type-check with mypy
              run: uv run mypy music21_mnx

    pylint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.14'
            - name: Install uv
              uses: astral-sh/setup-uv@v7
            - name: Install dependencies
              run: uv sync
            - name: Lint with pylint
              run: uv run pylint -j0 music21_mnx
